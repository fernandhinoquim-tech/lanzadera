name: Compilar para Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publicar:
        description: Publicar la versión de package.json en Releases (si la prueba de humo pasa)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Pruebas unitarias
        run: npm test

      - name: Diagnóstico del ayudante de Windows (iconos en alta resolución)
        shell: pwsh
        continue-on-error: true
        run: |
          $in = Join-Path $env:RUNNER_TEMP 'iconos.json'
          '[{"key":"explorer","path":"C:\\Windows\\explorer.exe","index":0,"useIndex":false},{"key":"equipo","path":"shell:MyComputerFolder","index":0,"useIndex":false}]' | Set-Content -LiteralPath $in -Encoding utf8
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File resources\win\helper.ps1 -Mode icons -In $in -Out $env:RUNNER_TEMP -Size 256
          Write-Host "Código: $LASTEXITCODE"
          Get-ChildItem $env:RUNNER_TEMP -Filter *.png | Format-Table Name, Length

      # Para probar la lectura de la temperatura del procesador, como la haría el usuario.
      - name: Abrir LibreHardwareMonitor con su servidor web
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 3
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'lhm.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'lhm'
          Invoke-WebRequest 'https://github.com/LibreHardwareMonitor/LibreHardwareMonitor/releases/download/v0.9.6/LibreHardwareMonitor.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '086d9f1b5a99e643edc2cfaaac16051685b551e4c5ac0b32a57c58c0e529c001') { throw "Hash inesperado: $hash" }
          Expand-Archive $zip -DestinationPath $dir -Force
          $exe = Get-ChildItem $dir -Recurse -Filter 'LibreHardwareMonitor.exe' | Select-Object -First 1
          '<?xml version="1.0" encoding="utf-8"?><configuration><appSettings><add key="runWebServerMenuItem" value="true" /><add key="listenerPort" value="8085" /><add key="startMinMenuItem" value="true" /><add key="minTrayMenuItem" value="true" /></appSettings></configuration>' | Set-Content (Join-Path $exe.DirectoryName 'LibreHardwareMonitor.config') -Encoding utf8
          Start-Process $exe.FullName -WorkingDirectory $exe.DirectoryName -WindowStyle Minimized
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest 'http://127.0.0.1:8085/data.json' -UseBasicParsing -TimeoutSec 2
              Write-Host "data.json responde ($($r.Content.Length) bytes)"
              break
            } catch { Start-Sleep 2 }
          }
          Get-Process LibreHardwareMonitor -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, MainWindowTitle

      - name: Prueba de humo (abre la app real y toma capturas)
        id: smoke
        shell: pwsh
        timeout-minutes: 12
        env:
          LANZADERA_SMOKE: ${{ runner.temp }}\smoke
          LANZADERA_USER_DATA: ${{ runner.temp }}\userdata
        run: |
          # Electron 44 descarga su ejecutable la primera vez que se pide; la ruta es la última línea.
          node -e "require('electron')" | Out-Host
          $exe = (node -p "require('electron')" | Select-Object -Last 1).Trim()
          if (!$exe -or !(Test-Path $exe)) {
            Write-Host "Electron no estaba descargado; instalando…"
            node node_modules/electron/install.js | Out-Host
            $exe = (node -p "require('electron')" | Select-Object -Last 1).Trim()
          }
          Write-Host "Electron: $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "`"$PWD`"" -WorkingDirectory "$PWD" -PassThru -Wait -NoNewWindow
          $code = $p.ExitCode
          if (Test-Path "$env:LANZADERA_SMOKE\report.json") { Get-Content "$env:LANZADERA_SMOKE\report.json" }
          else { Write-Host "No se generó el reporte" }
          if ($code -ne 0) { Write-Host "::error::La prueba de humo falló (código $code)"; exit 1 }

      - name: Publicar capturas en la rama ci-reports
        if: always() && github.event_name != 'pull_request'
        # Las capturas son informativas: un fallo de GitHub al subirlas no debe frenar el instalador.
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $dir = "$env:RUNNER_TEMP\smoke"
          if (!(Test-Path $dir)) { Write-Host "Sin capturas"; exit 0 }
          "Capturas de la prueba de humo para $env:GITHUB_SHA ($(Get-Date -Format o))" | Out-File "$dir\LEEME.txt" -Encoding utf8
          Set-Location $dir
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b ci-reports
          git add -A
          git commit -q -m "Capturas de $env:GITHUB_SHA"
          foreach ($i in 1..4) {
            git push -f -q "https://x-access-token:$env:GH_TOKEN@github.com/$env:GITHUB_REPOSITORY.git" ci-reports
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Start-Sleep -Seconds (5 * $i)
          }
          exit 1

      - name: ¿Hay una versión nueva para publicar?
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # Solo se publica desde main, si se pide (commit con [publicar] o ejecución manual con
          # «publicar») y la versión no existe todavía.
          WANT=false
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ contains(github.event.head_commit.message, '[publicar]') }}" = "true" ]; then WANT=true; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.publicar }}" = "true" ]; then WANT=true; fi
          # Una versión ya publicada sin su instalador (publicación interrumpida) se completa.
          if [ "$WANT" = "true" ] && [ "${{ github.ref }}" = "refs/heads/main" ] && ! gh release view "v$V" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx "Lanzadera-Setup-$V.exe"; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "Se publicará la versión v$V"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Solo se compila: para publicar hace falta pedirlo en main ([publicar] o ejecución manual) con una versión nueva (v$V)."
          fi

      # electron-builder solo compila: al publicar él mismo, a veces intenta crear la release
      # dos veces a la vez y la deja sin instalador.
      - name: Compilar instalador
        run: npx electron-builder --win --x64 --publish never

      - name: Publicar en Releases
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ steps.version.outputs.version }}
        run: |
          FILES=("dist/Lanzadera-Setup-$V.exe" "dist/Lanzadera-Setup-$V.exe.blockmap" "dist/latest.yml")
          for f in "${FILES[@]}"; do [ -f "$f" ] || { echo "::error::Falta $f"; exit 1; }; done
          sed "s/{{version}}/$V/g" build/notas-version.md > "$RUNNER_TEMP/notas.md"
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" "${FILES[@]}" --clobber
            gh release edit "v$V" --title "Lanzadera $V" --notes-file "$RUNNER_TEMP/notas.md" --draft=false --latest
          else
            gh release create "v$V" "${FILES[@]}" --title "Lanzadera $V" --notes-file "$RUNNER_TEMP/notas.md" --target "$GITHUB_SHA" --latest
          fi
          gh release view "v$V" --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'

      - name: Guardar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Lanzadera-${{ steps.version.outputs.version }}-instalador
          path: dist/*.exe
          retention-days: 14
